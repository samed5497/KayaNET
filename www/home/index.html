<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KayaNET</title>
<style>
  :root{--bg:#f4f6f9;--card:#fff;--ink:#14202e;--mute:#5b6b7c;--line:#e1e6ec;--acc:#0b6bcb;--acc2:#e8f1fc;--ok:#1a9d5b;--warn:#d98a00;--bad:#d33a2c;--shadow:0 1px 2px rgba(20,32,46,.06),0 4px 14px rgba(20,32,46,.05)}
  @media (prefers-color-scheme:dark){:root{--bg:#0e141b;--card:#16202b;--ink:#e8eef5;--mute:#93a3b5;--line:#243242;--acc:#4da3ff;--acc2:#16304d;--ok:#3ecf8e;--warn:#f0b429;--bad:#ff6b5e;--shadow:none}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1040px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .brand{font-size:26px;font-weight:800;letter-spacing:-.5px}.brand b{color:var(--acc)}
  .slogan{color:var(--mute);font-size:14px}
  nav{display:flex;gap:8px;flex-wrap:wrap}
  nav a{padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600}
  nav a.acil{background:var(--bad);border-color:var(--bad);color:#fff}
  .search{display:flex;gap:8px;flex-wrap:wrap;background:var(--card);padding:10px;border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
  .search input,.search select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
  .search input{flex:1 1 220px;min-width:0}.search select{flex:0 1 200px;max-width:100%}
  .search button{font:inherit;font-weight:700;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 22px;cursor:pointer}
  .alert{background:#fff4e0;color:#7a4b00;border:1px solid #f0c36a;border-radius:12px;padding:10px 14px;margin-top:12px;font-size:14px}
  @media (prefers-color-scheme:dark){.alert{background:#3a2c0d;color:#ffd98a;border-color:#6b5217}}
  .sys{margin:14px 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
  .sys h2{margin:0 0 10px;font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .sys h2 span{text-transform:none;letter-spacing:0;font-weight:400}
  .meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .m .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-bottom:4px}
  .m .lbl b{color:var(--ink);font-weight:600}
  .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .5s}
  .bar i.w{background:var(--warn)}.bar i.b{background:var(--bad)}
  .facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:13px}
  .facts span{background:var(--bg);border:1px solid var(--line);padding:4px 10px;border-radius:99px;color:var(--mute)}
  .facts span.bad{color:var(--bad);border-color:var(--bad)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
  .chips button{flex:none;font:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
  .chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
  h3{margin:18px 2px 8px;font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--mute)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);transition:transform .1s,border-color .1s}
  a.card:hover{transform:translateY(-2px);border-color:var(--acc)}
  .card .n{font-weight:700;font-size:16px;display:flex;justify-content:space-between;gap:8px}
  .card .d{color:var(--mute);font-size:14px;margin:4px 0 8px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
  .tags span{background:var(--acc2);color:var(--acc);padding:2px 8px;border-radius:99px;font-weight:600}
  .tags span.g{background:var(--bg);color:var(--mute);font-weight:400}
  .card.off{opacity:.55}.card.off .n::after{content:"yüklenmedi";font-size:11px;font-weight:600;color:var(--mute);align-self:center}
  .empty{color:var(--mute);padding:20px;text-align:center}
  footer{text-align:center;color:var(--mute);font-size:12px;margin:26px 0 8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="brand">Kaya<b>NET</b></div><div class="slogan">Çevrimdışı bilgi arşivi, internet olmasa da açık <span id="now"></span></div></div>
    <nav><a href="/home/acil.html" class="acil">Acil Durum</a><a href="/kiwix/">Kütüphane</a><a href="/maps">Haritalar</a><a href="/admin">Yönetim</a></nav>
  </header>

  <form class="search" id="search">
    <input type="search" id="q" placeholder="Ara: ilk yardım, su arıtma, anten..." autocomplete="off">
    <select id="book" aria-label="Kaynak"></select>
    <button>Ara</button>
  </form>
  <div id="disk"></div>

  <section class="sys ask" id="ask" hidden>
    <h2>Sor <span>yerel yapay zeka, kaynaklarla cevaplar</span></h2>
    <form class="search" id="askform" style="box-shadow:none;border:0;padding:0">
      <input type="text" id="aq" placeholder="Örn: Kanayan yarayı nasıl durdururum?" autocomplete="off">
      <button>Sor</button>
    </form>
    <div id="astage" class="slogan" style="margin-top:8px"></div>
    <div id="aout" style="white-space:pre-wrap;margin-top:8px"></div>
    <div id="asrc" class="facts"></div>
  </section>

  <section class="sys" id="sys" hidden>
    <h2>Sistem <span id="model"></span></h2>
    <div class="meters" id="meters"></div>
    <div class="facts" id="facts"></div>
  </section>

  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <footer>KayaNET &middot; CODLAI Teknoloji AŞ. &middot; İçerikler: Wikipedia, OpenStreetMap, Kiwix, ilgili lisanslar altında</footer>
</div>

<script>
/* İçerik listesi. Bölüm eklemek/çıkarmak için sadece burayı düzenle.
   zim: Kiwix dosya adının tarihsiz başı. Sayfa, cihazda hangi sürümün
        yüklü olduğunu Kiwix kataloğundan kendisi bulur.
   url: zim olmayan servisler için sabit adres.
   Cihazda bulunamayan ZIM'ler gri klasörle "henüz yüklenmedi" görünür. */
const CATS = [
  { title:"Ansiklopedi", items:[
    { name:"Vikipedi (Türkçe)", desc:"Türkçe Vikipedi'nin resimli tam kopyası.", lang:"TR", size:"~9 GB", zim:"wikipedia_tr_all_maxi", search:true },
    { name:"Wikipedia (English)", desc:"Tüm İngilizce Wikipedia, resimleriyle birlikte.", lang:"EN", size:"~120 GB", zim:"wikipedia_en_all_maxi", search:true },
  ]},
  { title:"Türkçe Kitaplık", items:[
    { name:"Vikisözlük", desc:"Türkçe sözlük, köken bilgisi ve çeviriler.", lang:"TR", size:"~810 MB", zim:"wiktionary_tr_all", search:true },
    { name:"Vikikitap", desc:"Açık ders kitapları ve el kitapları.", lang:"TR", size:"~27 MB", zim:"wikibooks_tr_all" },
    { name:"Vikikaynak", desc:"Telifsiz metinler, kanunlar, klasikler.", lang:"TR", size:"~68 MB", zim:"wikisource_tr_all" },
    { name:"Vikisöz", desc:"Özlü sözler ve alıntılar.", lang:"TR", size:"~59 MB", zim:"wikiquote_tr_all" },
    { name:"iFixit (Türkçe)", desc:"Cihaz ve araç tamiri için Türkçe adım adım rehberler.", lang:"TR", size:"~3,6 GB", zim:"ifixit_tr_all", search:true },
    { name:"PhET Simülasyonları", desc:"Fizik, kimya ve matematik etkileşimli deneyleri.", lang:"TR", size:"~107 MB", zim:"phet_tr_all" },
  ]},
  { title:"Haritalar ve Navigasyon", items:[
    { name:"Dünya Haritası", desc:"Avrupa ve Orta Doğu sokak seviyesinde, dünyanın geri kalanı şehir seviyesinde.", lang:"—", size:"~40 GB", url:"/maps" },
  ]},
  { title:"Hayatta Kalma ve Hazırlık", items:[
    { name:"Afet Sonrası Kitaplığı", desc:"Barınak, enerji, tarım ve yeniden yapılanma üzerine kitaplar.", lang:"EN", size:"~615 MB", zim:"zimgit-post-disaster_en", search:true },
    { name:"Su Arıtma", desc:"İçme suyu bulma, arıtma ve saklama.", lang:"EN", size:"~20 MB", zim:"zimgit-water_en" },
    { name:"Gıda Hazırlama ve Saklama", desc:"Konserve, kurutma ve uzun süreli gıda saklama.", lang:"EN", size:"~93 MB", zim:"zimgit-food-preparation_en" },
    { name:"Düğümler Kitaplığı", desc:"Düğüm çeşitleri ve kullanım alanları.", lang:"EN", size:"~27 MB", zim:"zimgit-knots_en" },
    { name:"Ready.gov", desc:"ABD resmi afet hazırlık rehberleri: deprem, sel, yangın.", lang:"EN", size:"~1,9 GB", zim:"ready.gov_en_all", search:true },
    { name:"Low-tech Magazine", desc:"Elektriksiz ve düşük teknolojili pratik çözümler.", lang:"EN", size:"~670 MB", zim:"solar.lowtechmagazine.com_mul_all" },
    { name:"Appropedia", desc:"Uygun teknoloji wiki'si: su, güneş enerjisi, tarım, barınak.", lang:"EN", size:"~580 MB", zim:"appropedia_en_all", search:true },
  ]},
  { title:"Sağlık ve İlk Yardım", items:[
    { name:"WikiMed", desc:"Wikipedia'nın tıp maddeleri: hastalıklar, ilaçlar, anatomi.", lang:"EN", size:"~2 GB", zim:"wikipedia_en_medicine_maxi", search:true },
    { name:"MDWiki", desc:"Doktorlar tarafından düzenlenen tıp ansiklopedisi.", lang:"EN", size:"~2 GB", zim:"mdwiki_en_all_maxi", search:true },
    { name:"MedlinePlus", desc:"ABD Ulusal Tıp Kütüphanesi hasta bilgilendirme sayfaları.", lang:"EN", size:"~1,9 GB", zim:"medlineplus.gov_en_all", search:true },
    { name:"Tıp Kitaplığı", desc:"Temel tıp ve sağlık kitapları.", lang:"EN", size:"~67 MB", zim:"zimgit-medicine_en" },
    { name:"Askeri Sahra Tıbbı", desc:"Sahada travma ve yaralı bakımı (FAS).", lang:"EN", size:"~65 MB", zim:"irp.fas.org_en_military-medicine" },
    { name:"NHS İlaç Rehberi", desc:"İlaçların kullanımı, dozları ve yan etkileri.", lang:"EN", size:"~15 MB", zim:"nhs.uk_en_medicines" },
  ]},
  { title:"Tamir ve Beceriler", items:[
    { name:"iFixit", desc:"Cihaz ve araç tamiri için adım adım rehberler.", lang:"EN", size:"~3 GB", zim:"ifixit_en_all", search:true },
    { name:"Ev Tamiri (DIY)", desc:"Elektrik, tesisat ve yapı soruları.", lang:"EN", size:"—", zim:"diy.stackexchange.com_en_all" },
    { name:"Bahçecilik", desc:"Sebze yetiştirme, toprak ve bitki hastalıkları.", lang:"EN", size:"—", zim:"gardening.stackexchange.com_en_all" },
    { name:"Yemek Pişirme", desc:"Pişirme teknikleri ve gıda güvenliği.", lang:"EN", size:"—", zim:"cooking.stackexchange.com_en_all" },
    { name:"Amatör Telsiz", desc:"Telsiz kurulumu, anten ve haberleşme.", lang:"EN", size:"—", zim:"ham.stackexchange.com_en_all" },
    { name:"Araç Bakımı", desc:"Motor, fren ve araç arızaları.", lang:"EN", size:"—", zim:"mechanics.stackexchange.com_en_all" },
    { name:"Doğa ve Kamp", desc:"Kamp, yürüyüş ve doğada hayatta kalma.", lang:"EN", size:"—", zim:"outdoors.stackexchange.com_en_all" },
    { name:"Sürdürülebilirlik", desc:"Enerji, su ve kaynak tasarrufu.", lang:"EN", size:"—", zim:"sustainability.stackexchange.com_en_all" },
  ]},
  { title:"Eğitim", items:[
    { name:"Kolibri", desc:"Çevrimdışı dersler ve eğitim videoları.", lang:"—", size:"—", url:"/kolibri" },
  ]},
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);
let ITEMS = [], filter = "";

/* Kiwix kataloğundan cihazdaki ZIM'leri oku */
async function loadBooks(){
  try{
    const r = await fetch("/kiwix/catalog/v2/entries?count=-1");
    const xml = new DOMParser().parseFromString(await r.text(), "application/xml");
    const books = [];
    for (const e of xml.querySelectorAll("entry")) {
      const l = e.querySelector('link[type="text/html"]');
      if (!l) continue;
      const href = l.getAttribute("href");
      books.push({ id: href.split("/").filter(Boolean).pop(), href, title: (e.querySelector("title")||{}).textContent || "" });
    }
    return books;
  }catch(e){ return null; }
}

function build(books){
  const used = new Set(), sel = $("book");
  for (const c of CATS) for (const i of c.items) {
    let url = i.url || null, status = "";
    if (i.zim) {
      if (books === null) { url = "/kiwix/"; }
      else {
        const b = books.filter(b => b.id.startsWith(i.zim + "_")).sort((a,z) => a.id < z.id ? 1 : -1)[0];
        if (b) {
          used.add(b.id); url = b.href;
          const v = b.id.match(/(\d{4})-(\d{2})[a-z]?$/); if (v) status = `${v[2]}/${v[1]}`;
          if (i.search) sel.add(new Option(i.name, b.id));
        }
      }
    }
    ITEMS.push({ cat:c.title, ...i, url, status });
  }
  for (const b of (books||[]).filter(b => !used.has(b.id)))
    ITEMS.push({ cat:"Diğer Kaynaklar", name:b.title || b.id, desc:b.id, lang:"", size:"", url:b.href, status:"" });
  sel.insertBefore(new Option("Tüm kütüphane", ""), sel.firstChild); sel.selectedIndex = 0;
  const cats = ["Tümü", ...new Set(ITEMS.map(i => i.cat))];
  $("chips").innerHTML = cats.map((c,k) => `<button data-c="${k?esc(c):""}" class="${k?"":"on"}">${esc(c)}</button>`).join("");
  $("chips").onclick = e => { const b = e.target.closest("button"); if(!b) return;
    filter = b.dataset.c; [...$("chips").children].forEach(x => x.classList.toggle("on", x === b)); draw(); };
  draw();
}

function draw(){
  const q = $("q").value.trim().toLocaleLowerCase("tr");
  const shown = ITEMS.filter(i => (!filter || i.cat === filter) &&
    (!q || (i.name + " " + i.desc).toLocaleLowerCase("tr").includes(q)));
  let html = "", last = "";
  for (const i of shown) {
    if (i.cat !== last) { if (last) html += "</div>"; html += `<h3>${esc(i.cat)}</h3><div class="grid">`; last = i.cat; }
    const tags = [i.lang && i.lang !== "—" ? `<span>${esc(i.lang)}</span>` : "", i.size && i.size !== "—" ? `<span class="g">${esc(i.size)}</span>` : "",
      i.status ? `<span class="g">${esc(i.status)}</span>` : ""].join("");
    const inner = `<div class="n">${esc(i.name)}</div><div class="d">${esc(i.desc)}</div><div class="tags">${tags}</div>`;
    html += i.url ? `<a class="card" href="${esc(i.url)}">${inner}</a>` : `<div class="card off">${inner}</div>`;
  }
  if (last) html += "</div>";
  $("list").innerHTML = html || `<div class="empty">Sonuç yok.</div>`;
}
$("q").addEventListener("input", draw);

$("search").addEventListener("submit", e => {
  e.preventDefault();
  const q = $("q").value.trim(), book = $("book").value;
  if (!q) return;
  location.href = book
    ? `/kiwix/search?books.name=${encodeURIComponent(book)}&pattern=${encodeURIComponent(q)}`
    : `/kiwix/search?pattern=${encodeURIComponent(q)}`;
});

/* Sunucu saati: HTTP Date başlığından */
fetch(location.href, {method:"HEAD", cache:"no-store"}).then(r => {
  const d = new Date(r.headers.get("Date")); if (isNaN(d)) return;
  $("now").textContent = "· " + d.toLocaleDateString("tr-TR") + " " + d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
}).catch(() => {});

/* Disk ve güç uyarıları */
fetch("/home/disk.json", {cache:"no-store"}).then(r => r.ok ? r.json() : null).then(d => {
  if (d && d.warnings) $("disk").innerHTML = d.warnings.map(w => `<div class="alert">${esc(w)}</div>`).join("");
}).catch(() => {});

/* Sistem bilgisi: stats.json 5 sn'de bir */
const fmtMB = m => m >= 1024 ? (m/1024).toFixed(1) + " GB" : m + " MB";
const lvl = p => p >= 90 ? "b" : p >= 75 ? "w" : "";
const meter = (l, p, t) => `<div class="m"><div class="lbl"><span>${l}</span><b>${t}</b></div><div class="bar"><i class="${lvl(p)}" style="width:${Math.min(100,p)}%"></i></div></div>`;
function showStats(s){
  const m = [], memUsed = s.mem.total - s.mem.avail;
  m.push(meter("CPU", s.cpu, s.cpu + "%" + (s.freq ? " · " + s.freq + " MHz" : "")));
  m.push(meter("RAM", 100*memUsed/s.mem.total, `${fmtMB(memUsed)} / ${fmtMB(s.mem.total)}`));
  if (s.swap.total) m.push(meter("Takas", 100*(s.swap.total-s.swap.free)/s.swap.total, `${fmtMB(s.swap.total-s.swap.free)} / ${fmtMB(s.swap.total)}`));
  if (s.temp !== null) m.push(meter("Sıcaklık", s.temp, s.temp + " °C"));
  for (const d of s.disks) m.push(meter(d.mount === "/" ? "Disk (SD)" : "Disk " + d.mount, 100*d.used/d.total, `${fmtMB(d.used)} / ${fmtMB(d.total)}`));
  $("meters").innerHTML = m.join("");
  const up = s.uptime, f = [`Çalışma: ${Math.floor(up/86400)}g ${Math.floor(up%86400/3600)}s ${Math.floor(up%3600/60)}dk`, `Yük: ${s.load} (${s.cores} çekirdek)`];
  if (s.clients !== null) f.push(`Bağlı cihaz: ${s.clients}`);
  if (s.throttled !== null) f.push(s.throttled & 0x1 ? "⚠ Düşük voltaj şu an" : s.throttled & 0x10000 ? "⚠ Açılıştan beri düşük voltaj oldu" : "Güç: sorunsuz");
  $("facts").innerHTML = f.map(t => `<span class="${t.startsWith("⚠") ? "bad" : ""}">${esc(t)}</span>`).join("");
  $("model").textContent = s.model;
  $("sys").hidden = false;
}
function pollStats(){
  fetch("/home/stats.json", {cache:"no-store"}).then(r => r.ok ? r.json() : null).then(s => { if (s) showStats(s); }).catch(() => {});
}
pollStats(); setInterval(() => { if (!document.hidden) pollStats(); }, 5000);

/* Yapay zeka asistanı: servis (8081) çalışıyorsa "Sor" kutusu görünür */
const ASK = location.protocol + "//" + location.hostname + ":8081";
fetch(ASK + "/status", {cache:"no-store"}).then(r => r.json()).then(s => { if (s.llm) $("ask").hidden = false; }).catch(() => {});
$("askform").addEventListener("submit", async e => {
  e.preventDefault();
  const q = $("aq").value.trim(); if (!q) return;
  $("aout").textContent = ""; $("asrc").innerHTML = ""; $("astage").textContent = "Gönderiliyor...";
  try {
    const r = await fetch(ASK + "/ask", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({q})});
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const {value, done} = await rd.read(); if (done) break;
      buf += dec.decode(value, {stream:true});
      let k; while ((k = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, k).replace(/^data: /, ""); buf = buf.slice(k + 2);
        const m = JSON.parse(line);
        if (m.stage) $("astage").textContent = m.stage;
        if (m.token) { $("astage").textContent = ""; $("aout").textContent += m.token; }
        if (m.reset) $("aout").textContent = "";
        if (m.error) $("aout").textContent = m.error;
        if (m.sources) $("asrc").innerHTML = m.sources.map(x => `<span><a href="${esc(x.url)}">${esc(x.title)}</a></span>`).join("");
        if (m.done) $("astage").textContent = "Yapay zeka hata yapabilir. Önemli konularda kaynakları kontrol edin.";
      }
    }
  } catch (err) { $("aout").textContent = "Yapay zeka servisine ulaşılamadı. Normal aramayı kullanın."; $("astage").textContent = ""; }
});

loadBooks().then(build);
</script>
</body>
</html>
